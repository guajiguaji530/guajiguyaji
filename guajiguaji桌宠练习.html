<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小黑粘人小鸟桌宠</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
}
body{
  height:100vh;
  background:#f5f5f5;
  overflow:hidden;
}
.pet-box{
  position:fixed;
  left:120px;
  top:120px;
  width:148px;
  height:168px;
  cursor:grab;
  z-index:9999;
}
.pet-box:active{
  cursor:grabbing;
}
@keyframes dragShake {
  0% { transform: translateY(-2px) rotate(-1deg); }
  100% { transform: translateY(2px) rotate(1deg); }
}
.pet-box.dragging{
  animation:dragShake 0.22s infinite alternate;
}
.bird{
  width:100%;
  height:100%;
  position:relative;
  transition:transform 0.2s ease;
}
.bird-ahoge{
  position:absolute;
  width:10px;
  height:34px;
  background:#000;
  left:50%;
  top:18px;
  transform:translateX(-50%) rotate(0deg);
  border-radius:50% 50% 45% 45%;
  transform-origin:center bottom;
  transition:transform 0.35s ease;
  z-index:6;
}
.bird-ahoge::before{
  content:"";
  position:absolute;
  width:10px;
  height:18px;
  background:#000;
  left:-18px;
  top:4px;
  border-radius:50%;
  transform-origin:center bottom;
  transform:rotate(-25deg);
  transition:transform 0.35s ease;
}
.bird-ahoge::after{
  content:"";
  position:absolute;
  width:10px;
  height:18px;
  background:#000;
  right:-18px;
  top:4px;
  border-radius:50%;
  transform-origin:center bottom;
  transform:rotate(25deg);
  transition:transform 0.35s ease;
}
.bird.happy .bird-ahoge{
  transform:translateX(-50%) rotate(-8deg) scaleY(1.15);
}
.bird.confused .bird-ahoge{
  transform:translateX(-50%) rotate(12deg);
}
.bird.confused .bird-ahoge::before{
  transform:rotate(-15deg);
}
.bird.confused .bird-ahoge::after{
  transform:rotate(18deg);
}
.bird-head{
  position:absolute;
  width:110px;
  height:86px;
  left:18px;
  top:30px;
  z-index:5;
  background:linear-gradient(145deg, #080808 0%, #1a1a1a 48%, #080808 100%);
  border-radius: 44% 44% 5% 20% / 68% 68% 20% 20%;
  box-shadow:
	inset -6px -6px 16px rgba(0,0,0,0.9),
	inset 6px 6px 16px rgba(255,255,255,0.08);
	transform-origin: center center;
  transform: scale(0.92);
}
.bird-head::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  left:0;
  top:0;
  border-radius:inherit;
  background-image:
	radial-gradient(circle at 12% 16%, rgba(255,255,255,0.10) 0%, transparent 8%),
	radial-gradient(circle at 85% 18%, rgba(255,255,255,0.10) 0%, transparent 8%),
	radial-gradient(circle at 50% 90%, rgba(255,255,255,0.08) 0%, transparent 12%);
  pointer-events:none;
}
.bird-face{
  position:absolute;
  width:72px;
  height:50px;
  left:50%;
  top:14px;
  transform:translateX(-50%);
  z-index:5;
}
.eye-fur{
  position:absolute;
  width:34px;
  height:34px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.45) 45%, transparent 72%);
  top:2px;
  z-index:3;
}
.eye-fur-left{left:0;}
.eye-fur-right{right:0;}
.eye{
  position:absolute;
  width:24px;
  height:24px;
  background:#fff;
  border-radius:50%;
  top:7px;
  overflow:hidden;
  z-index:4;
  cursor:pointer;
}
.eye-left{left:3px;}
.eye-right{right:3px;}
.eyeball{
  position:absolute;
  width:18px;
  height:18px;
  background:#000;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:transform 0.18s ease;
}
.eye-highlight{
  position:absolute;
  width:6px;
  height:6px;
  background:#fff;
  border-radius:50%;
  top:4px;
  right:4px;
}
.eyelid{
  position:absolute;
  width:36px;
  height:0;
  background:#080808;
  top:0;
  left:-6px;
  border-radius:50%;
  transition:height 0.22s ease;
  z-index:5;
}
.eye-left .eyelid{left:-6px;}
.eye-right .eyelid{left:-14px;}
.mole{
  position:absolute;
  width:4px;
  height:4px;
  background:#ffffff;
  border-radius:50%;
  left:55%;
  top:32px;
  z-index:7;
}
.blush-left,.blush-right{
  position:absolute;
  width:17px;
  height:17px;
  background:radial-gradient(ellipse, rgba(255,140,140,0.42), transparent 72%);
  border-radius:50%;
  opacity:0;
  transition:opacity 0.8s ease;
  z-index:6;
}
.blush-left{
  left:0px;
  top:28px;
}
.blush-right{
  right:0px;
  top:28px;
}
.bird.blush-on .blush-left,.bird.blush-on .blush-right{
  opacity:1;
}
.bird-beak{
  position:absolute;
  width:20px;
  height:15px;
  background:#dc2626;
  left:50%;
  top:20px;
  transform:translate(-50%, 0);
  transform-origin:center top;
  z-index:6;
  transition:all 0.18s ease;
  cursor:pointer;
  clip-path:polygon(50% 100%, 0 0, 100% 0);
  border-radius:0;
}
.bird-beak.open{
  width:30px;
  height:15px;
  background:#dc2626;
  clip-path:polygon(50% 100%, 0 0, 100% 0);
  border-radius:0;
}
.bird-beak.smile{
  width:20px;
  height:10px;
  background:#dc2626;
  clip-path:polygon(50% 100%, 0 0, 100% 0);
  border-radius:0;
}
.bird-beak.surprised{
  width:24px;
  height:10px;
  background:#ff4444;
  clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  border-radius:0;
}
.bird-beak.sleepy{
  width:17px;
  height:11px;
  background:#cc2222;
  transform:translate(-50%, 0);
}
.bird-beak.worry{
  width:18px;
  height:18px;
  clip-path:polygon(50% 0, 0 100%, 100% 100%);
  top:10px;
  transform:translate(-50%, 0);
}
.bird-body{
  position:absolute;
  width:90px;
  height:64px;
  background:#111;
  border-radius:50%;
  left:29px;
  top:80px;
  z-index:2;
  transform-origin:center top;
  transition:all 0.25s;
  cursor:pointer;
}
.wing{
  width:34px;
  height:52px;
  background:#050505;
  border-radius:40%;
  position:absolute;
  top:82px;
  transition:transform 0.35s ease;
  cursor:pointer;
}
.wing-l{
  left:20px;
  transform:rotate(12deg);
  transform-origin:left center;
}
.wing-r{
  right:20px;
  transform:rotate(-12deg);
  transform-origin:right center;
}
.wing.open{
  transform:rotate(-38deg) translateY(0);
}
.wing-r.open{
  transform:rotate(38deg) translateY(0);
}
.wing.fastflap{
  animation:fastFlap 0.22s ease-in-out 2;
}
.wing-r.fastflap{
  animation:fastFlapR 0.22s ease-in-out 2;
}
.wing.flap{
  animation:flapWing 0.35s ease-in-out infinite;
}
.wing-r.flap{
  animation:flapWingR 0.35s ease-in-out infinite;
}
@keyframes fastFlap {
  0%{transform:rotate(12deg);}
  50%{transform:rotate(-38deg);}
  100%{transform:rotate(12deg);}
}
@keyframes fastFlapR {
  0%{transform:rotate(-12deg);}
  50%{transform:rotate(38deg);}
  100%{transform:rotate(-12deg);}
}
@keyframes flapWing {
  0%{transform:rotate(12deg);}
  50%{transform:rotate(-38deg);}
  100%{transform:rotate(12deg);}
}
@keyframes flapWingR {
  0%{transform:rotate(-12deg);}
  50%{transform:rotate(38deg);}
  100%{transform:rotate(-12deg);}
}
.bird-foot{
  width:16px;
  height:16px;
  background:#e62828;
  border-radius:50%;
  position:absolute;
  bottom:31px;
  cursor:pointer;
  transition:transform 0.2s ease;
  z-index:10;
}
.bird-foot.retract{
  transform:translateY(-6px);
}
.foot1{left:44px;}
.foot2{right:44px;}
.bird.idle{animation:idleBreath 4s infinite ease-in-out;}
@keyframes idleBreath{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.015);}
}
.bird.happy-praise{animation:happyJump 0.32s infinite alternate;}
@keyframes happyJump {
  0% { transform: translateY(0); }
  100% { transform: translateY(-8px); }
}
.bird.happy-praise .bird-ahoge{
  animation:ahogeBounce 0.32s infinite alternate;
}
@keyframes ahogeBounce {
  0% { transform: translateX(-50%) rotate(-8deg) scaleY(1.15); }
  100% { transform: translateX(-50%) rotate(8deg) scaleY(1.25); }
}
.bird.happy-praise .foot1{
  animation:footWiggleLeft 0.32s infinite alternate;
}
.bird.happy-praise .foot2{
  animation:footWiggleRight 0.32s infinite alternate;
}
@keyframes footWiggleLeft {
  0% { transform: translateX(0) translateY(0); }
  100% { transform: translateX(-3px) translateY(-2px); }
}
@keyframes footWiggleRight {
  0% { transform: translateX(0) translateY(0); }
  100% { transform: translateX(3px) translateY(-2px); }
}
.bird.lie{transform:translateY(12px) scaleY(0.88);}
.bird.lie .bird-body{border-radius:60% 60% 50% 50%;}
.bird.eat{animation:eatNod 0.25s infinite alternate;}
.bird.eat-close{animation:eatNod 0.22s infinite alternate;}
@keyframes eatNod{
  0%{transform:translateY(0);}
  100%{transform:translateY(-4px);}
}
.bird.eat .bird-beak,
.bird.eat-close .bird-beak{
  animation:eatMouthPulse 0.18s infinite alternate, eatMouthFlash 0.18s infinite alternate;
}
@keyframes eatMouthPulse {
  0% {
	transform: translate(-50%, 0) scale(1);
  }
  100% {
	transform: translate(-50%, 0) scale(1.15);
  }
}
@keyframes eatMouthFlash {
  0% {
	opacity:1;
  }
  100% {
	opacity:0.65;
  }
}
.bird.eat .bird-ahoge{
  animation:ahogeBounce 0.25s infinite alternate;
}
.bird.pet-head .bird-ahoge{
  animation:ahogePet 0.45s ease-in-out;
}
.bird-ahoge.pet-ahoge{
  animation:ahogePet 0.45s ease-in-out;
}
@keyframes ahogePet {
  0% { transform: translateX(-50%) rotate(0deg); }
  25% { transform: translateX(-50%) rotate(-12deg) scaleY(1.18); }
  50% { transform: translateX(-50%) rotate(10deg) scaleY(1.12); }
  75% { transform: translateX(-50%) rotate(-6deg) scaleY(1.08); }
  100% { transform: translateX(-50%) rotate(0deg); }
}
.bird.sleep{
  transform: translateY(14px) scaleY(0.85);
}
.bird.sleep .bird-body{
  border-radius:65% 65% 50% 50%;
  animation:breath 2.8s infinite ease-in-out;
}
.bird.sleep .eyelid{
  height:34px;
 }
@keyframes breath{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.04);}
}
.food{
  width:16px;
  height:16px;
  background:#cc8822;
  border-radius:50%;
  position:absolute;
  left:56px;
  top:64px;
  opacity:0;
  transform:scale(0.3);
  transition:all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index:11;
}
.food.gone{
  opacity:0 !important;
  transform:scale(0) translateY(-8px) !important;
  pointer-events:none !important;
}
/* ===== 配饰通用 ===== */
.accessory{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  z-index:12;
  display:none;
}
.head-accessory{
  z-index:25;
}
.body-accessory{
  z-index:8;
}

/* ============================================================ */
/* ===== 头饰 ===== */

/* 皇冠 */
.crown{
  width:28px;
  height:26px;
  position:absolute;
  left:46%;
  top:28px;
  transform:translateX(-50%) rotate(-4deg);
  z-index:25;
  display:none;
}
.crown-main{
  width:28px;
  height:14px;
  background:linear-gradient(180deg,#ffd700 0%,#ffed4e 48%,#ffd700 100%);
  border-radius:8px 8px 12px 12px;
  position:relative;
  box-shadow:0 0 6px rgba(255,215,0,0.5);
}
.crown-tip{
  position:absolute;
  width:0;
  height:0;
  border-left:4px solid transparent;
  border-right:4px solid transparent;
  border-bottom:11px solid #ffd700;
  top:-9px;
}
.crown-tip-1{left:2px;}
.crown-tip-2{left:10px;}
.crown-tip-3{right:10px;}
.crown-tip-4{right:2px;}
.crown-dot{
  position:absolute;
  width:3px;
  height:3px;
  background:#fff;
  border-radius:50%;
  top:5px;
}
.crown-dot-1{left:6px;}
.crown-dot-2{left:13px;}
.crown-dot-3{right:13px;}
.crown-dot-4{right:6px;}
/* 草帽 */
.hat{
  position:absolute;
  left:50%;
  top:16px;
  transform:translateX(-50%) rotate(-3deg);
  z-index:23;
  width:54px;
  height:24px;
  display:none;
}
.hat-brim{
  width:58px;
  height:8px;
  background:linear-gradient(180deg,#d4a574 0%,#c4956a 100%);
  border-radius:50%;
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  box-shadow:0 2px 5px rgba(0,0,0,0.15);
}
.hat-top{
  width:34px;
  height:20px;
  background:linear-gradient(180deg,#e8c8a0 0%,#d4a574 100%);
  border-radius:50% 50% 20% 20% / 80% 80% 20% 20%;
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
}
.hat-band{
  width:38px;
  height:4px;
  background:#c0392b;
  border-radius:2px;
  position:absolute;
  bottom:5px;
  left:50%;
  transform:translateX(-50%);
  z-index:2;
}

/* 粉色蝴蝶结 - 继续下移到24px */
.bow-pink{
  position:absolute;
  left:50%;
  top:24px;
  transform:translateX(-50%) rotate(-2deg);
  z-index:26;
  width:22px;
  height:16px;
  display:none;
}
.bow-pink-left{
  position:absolute;
  left:0;
  top:1px;
  width:11px;
  height:11px;
  background:linear-gradient(135deg, #ffb6c1, #ff8a9e 50%, #ff6b7f);
  border-radius:0 50% 50% 50%;
  box-shadow:0 1px 4px rgba(255,100,130,0.2);
}
.bow-pink-right{
  position:absolute;
  right:0;
  top:1px;
  width:11px;
  height:11px;
  background:linear-gradient(225deg, #ffb6c1, #ff8a9e 50%, #ff6b7f);
  border-radius:50% 0 50% 50%;
  box-shadow:0 1px 4px rgba(255,100,130,0.2);
}
.bow-pink-center{
  position:absolute;
  left:50%;
  top:2px;
  transform:translateX(-50%);
  width:6px;
  height:7px;
  background:linear-gradient(180deg, #ff8a9e, #ff6b7f);
  border-radius:3px;
  z-index:2;
}

/* 深蓝蝴蝶结 */
.bow-blue{
  position:absolute;
  left:50%;
  top:26px;
  transform:translateX(-50%) rotate(-3deg);
  z-index:24;
  width:30px;
  height:20px;
  display:none;
}
.bow-blue-left{
  position:absolute;
  left:0;
  top:1px;
  width:15px;
  height:15px;
  background:linear-gradient(135deg, #1a2a4a 0%, #2a3a6a 40%, #1a2a4a 100%);
  border-radius:0 50% 50% 50%;
  box-shadow:0 1px 6px rgba(0,0,20,0.25), inset -1px -1px 4px rgba(255,215,0,0.12);
  border:0.5px solid rgba(255,215,0,0.2);
}
.bow-blue-right{
  position:absolute;
  right:0;
  top:1px;
  width:15px;
  height:15px;
  background:linear-gradient(225deg, #1a2a4a 0%, #2a3a6a 40%, #1a2a4a 100%);
  border-radius:50% 0 50% 50%;
  box-shadow:0 1px 6px rgba(0,0,20,0.25), inset 1px -1px 4px rgba(255,215,0,0.12);
  border:0.5px solid rgba(255,215,0,0.2);
}
.bow-blue-center{
  position:absolute;
  left:50%;
  top:3px;
  transform:translateX(-50%);
  width:7px;
  height:9px;
  background:linear-gradient(180deg, #2a3a6a, #1a2a4a);
  border-radius:3px;
  border:0.5px solid rgba(255,215,0,0.3);
}
.bow-blue-center::after{
  content:"";
  position:absolute;
  width:3px;
  height:3px;
  background:#ffd700;
  border-radius:50%;
  left:2px;
  top:3px;
  opacity:0.4;
}
.bow-blue-tail{
  position:absolute;
  width:4px;
  height:10px;
  background:linear-gradient(180deg, #2a3a6a, #1a2a4a);
  border-radius:0 0 4px 4px;
  top:14px;
  border:0.3px solid rgba(255,215,0,0.15);
}
.bow-blue-tail-l{left:6px; transform:rotate(-6deg);}
.bow-blue-tail-r{right:6px; transform:rotate(6deg);}

/* ===== 花冠 - 下移贴头 + 中间小银冠 ===== */
.flower-crown{
  position:absolute;
  left:50%;
  top:10px;
  transform:translateX(-50%) rotate(-2deg);
  z-index:30;
  width:64px;
  height:40px;
  pointer-events:none;
  display:none;
}
/* 头纱 */
.flower-crown-veil{
  position:absolute;
  width:76px;
  height:50px;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.25) 30%, rgba(255,255,255,0.08) 60%, rgba(255,255,255,0.02) 85%);
  border-radius:50% 50% 30% 30% / 60% 60% 20% 20%;
  top:-2px;
  left:-30px;
  pointer-events:none;
  border:0.5px solid rgba(255,255,255,0.15);
  box-shadow:0 0 30px rgba(255,255,255,0.04);
}
/* 左边大花 */
.flower-left{
  position:absolute;
  left:0px;
  top:25px;
  width:24px;
  height:24px;
}
.flower-left .petal{
  position:absolute;
  width:10px;
  height:11px;
  background:radial-gradient(circle at 40% 35%, #ffffff, #fce4ec 40%, #f8bbd0 65%, #e8a0b0);
  border-radius:50%;
  transform-origin:center center;
  border:0.3px solid rgba(255,182,193,0.12);
  box-shadow:0 0 10px rgba(255,200,210,0.2);
}
.flower-left .petal:nth-child(1){transform:rotate(0deg) translate(6.5px, 0px);}
.flower-left .petal:nth-child(2){transform:rotate(72deg) translate(6.5px, 0px);}
.flower-left .petal:nth-child(3){transform:rotate(144deg) translate(6.5px, 0px);}
.flower-left .petal:nth-child(4){transform:rotate(216deg) translate(6.5px, 0px);}
.flower-left .petal:nth-child(5){transform:rotate(288deg) translate(6.5px, 0px);}
.flower-left .center{
  position:absolute;
  width:8px;
  height:8px;
  background:radial-gradient(circle, #ffd700 0%, #ffb300 60%, #e8a000 100%);
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  z-index:2;
  box-shadow:0 0 14px rgba(255,215,0,0.4), 0 0 28px rgba(255,215,0,0.1);
}
/* 中间小银冠 - 在花冠正中央 */
.flower-crown-silver{
  position:absolute;
  left:50%;
  top:23px;
  transform:translateX(-50%);
  z-index:31;
  width:20px;
  height:14px;
}
.flower-crown-silver-base{
  width:20px;
  height:8px;
  background:linear-gradient(180deg, #e8e8f0 0%, #c8c8d8 50%, #b0b0c0 100%);
  border-radius:4px 4px 8px 8px;
  position:relative;
  box-shadow:0 0 8px rgba(200,200,220,0.2);
  border:0.5px solid rgba(180,180,200,0.1);
}
.flower-crown-silver-tip{
  position:absolute;
  width:0;
  height:0;
  border-left:3px solid transparent;
  border-right:3px solid transparent;
  border-bottom:8px solid #d0d0e0;
  top:-7px;
}
.flower-crown-silver-tip-1{left:2px;}
.flower-crown-silver-tip-2{left:6px;}
.flower-crown-silver-tip-3{right:2px;}
.flower-crown-silver-dot{
  position:absolute;
  width:2px;
  height:2px;
  background:rgba(255,255,255,0.4);
  border-radius:50%;
  top:3px;
}
.flower-crown-silver-dot-1{left:5px;}
.flower-crown-silver-dot-2{left:10px;}
.flower-crown-silver-dot-3{right:5px;}
/* 右边上花 */
.flower-right-top{
  position:absolute;
  right:2px;
  top:29px;
  width:6px;
  height:18px;
}
.flower-right-top .petal{
  position:absolute;
  width:8px;
  height:8px;

  left:28px;

// ===== 核心函数 =====
function showDialog(type){
  let pickText;
  if (type === 'sing') {
	pickText = singPool[Math.floor(Math.random() * singPool.length)];
  } else {
	const arr = textPool[type];
	pickText = arr[Math.floor(Math.random() * arr.length)];
  }
  showCustomDialog(pickText);
}

function showCustomDialog(customText){
  clearTimeout(dialogHideTimer);
  dialog.innerText = customText;
  dialog.classList.add('show');
  dialog.onmouseenter = () => clearTimeout(dialogHideTimer);
  dialog.onmouseleave = startDialogCloseTimer;
  startDialogCloseTimer();
  if (!isClassicMode) resetIdleTimer();
}

function startDialogCloseTimer(){
  dialogHideTimer = setTimeout(() => {
	dialog.classList.remove('show');
	dialog.onmouseenter = null;
	dialog.onmouseleave = null;
  }, DIALOG_SHOW_TIME);
}

function openBlush(){ birdMain.classList.add('blush-on'); }
function closeBlush(){ birdMain.classList.remove('blush-on'); }

function shyCloseEye(){
  const closeTime = 2000 + Math.random() * 1000;
  eyes.forEach(lid => lid.style.height = '34px');
  setTimeout(() => { eyes.forEach(lid => lid.style.height = '0'); }, closeTime);
}

function touchLongCloseEye(){
  const closeTime = 3200 + Math.random() * 1000;
  eyes.forEach(lid => lid.style.height = '34px');
  setTimeout(() => { eyes.forEach(lid => lid.style.height = '0'); }, closeTime);
}

function blinkEyesTwice(){
  eyes.forEach(lid => lid.style.height = '34px');
  setTimeout(() => eyes.forEach(lid => lid.style.height = '0'), 80);
  setTimeout(() => eyes.forEach(lid => lid.style.height = '34px'), 160);
  setTimeout(() => eyes.forEach(lid => lid.style.height = '0'), 240);
}

function blinkOnce(){
  eyes.forEach(lid => lid.style.height = '34px');
  setTimeout(() => eyes.forEach(lid => lid.style.height = '0'), 100);
}

function setExpression(type){
  beakMain.classList.remove('open','smile','sleepy','worry','surprised');
  switch(type){
	case 'happy': beakMain.classList.add('smile'); break;
	case 'surprised': beakMain.classList.add('surprised'); break;
	case 'eat': beakMain.classList.add('open'); eyes.forEach(lid => lid.style.height = '20px'); break;
	case 'sleep': beakMain.classList.add('sleepy'); break;
	case 'sad': beakMain.classList.add('worry'); break;
  }
}
function resetIdleTimer(){
  if (isClassicMode) return;
  clearTimeout(sleepTimer);
  clearTimeout(idleTalkTimer);
  clearTimeout(clickFailTimer);
  clearTimeout(idleStateTimer);
  birdMain.classList.remove('sing','sleep','daze');
  noteEl.style.opacity = 0;
  idleTalkTimer = setTimeout(() => {
	if(!isSleep){ showDialog('idleMiss'); setExpression('sad'); }
  }, IDLE_MISS_TIME);
  sleepTimer = setTimeout(() => {
	if(!isSleep){ enterSleep(); }
  }, IDLE_SLEEP_TIME);
}

function enterSleep(){
  if (isClassicMode) return;
  isSleep = true;
  birdMain.classList.add('sleep');
  setExpression('sleep');
  [wingLeft,wingRight].forEach(w => w.classList.remove('flap','fastflap','open'));
  showDialog('sleepChat');
}

function wakeUp(){
  isSleep = false;
  birdMain.classList.remove('sleep');
  setExpression('happy');
  blinkEyesTwice();
  showDialog('wake');
  resetIdleTimer();
}

function startSinging(){
  if(isSleep || isClassicMode) return;
  birdMain.classList.add('sing');
  noteEl.style.opacity = 1;
  setExpression('happy');
  showDialog('sing');
  [wingLeft,wingRight].forEach(w => w.classList.add('flap'));
  setTimeout(() => {
	birdMain.classList.remove('sing');
	noteEl.style.opacity = 0;
	[wingLeft,wingRight].forEach(w => w.classList.remove('flap'));
  }, 4000);
}

function showFood(){ foodItem.classList.remove('gone'); foodItem.style.opacity = '1'; foodItem.style.transform = 'scale(1)'; }

  if (isClassicMode) return;
  birdMain.classList.add('pet-head');
  ahogeEl.classList.add('pet-ahoge');
  setTimeout(() => {
	birdMain.classList.remove('pet-head');
	ahogeEl.classList.remove('pet-ahoge');
  }, 450);
  showDialog('ahogeLove');
  touchLongCloseEye();
  openBlush();
  setExpression('happy');
  setTimeout(closeBlush, 2000);
}

function startEating(){
  if (isClassicMode) return;
  birdMain.classList.add('eat');
  beakMain.classList.add('open');
  showFood();
  setTimeout(() => {
	hideFood();

	const cfg = categoryConfig[c];
	const isActive = (c === entry.category) ? 'active' : '';
	tagsHtml += `<span class="classic-tag ${isActive}"><span class="classic-tag-icon">${cfg.icon}</span>${cfg.label}</span>`;
  });
  
  dialog.className = 'dialog-box classic-dialog';
  dialog.innerHTML = `
	<button class="classic-close" id="classicCloseBtn">✕</button>
	<span class="classic-title">${entry.title}</span>
	<span class="classic-quote">「${entry.quote}」</span>
	<span>${entry.thought}</span>
	<div class="classic-nav">
	  <button id="classicPrev">◀</button>
	  <span class="classic-counter">${index + 1} / ${total}</span>
	  <button id="classicNext">▶</button>
	</div>
	<div class="classic-tags">${tagsHtml}</div>
  `;
  dialog.classList.add('show');
  
  document.getElementById('classicCloseBtn').addEventListener('click', function(e) {
	e.stopPropagation();
	closeClassicDialog();
  });
  
  document.getElementById('classicPrev').addEventListener('click', function(e) {
	e.stopPropagation();
	classicCurrentIndex = (classicCurrentIndex - 1 + classicData.length) % classicData.length;
	renderClassicEntry(classicCurrentIndex);
  });
  
  document.getElementById('classicNext').addEventListener('click', function(e) {
	e.stopPropagation();
	classicCurrentIndex = (classicCurrentIndex + 1) % classicData.length;
	renderClassicEntry(classicCurrentIndex);
  });
  
  document.querySelectorAll('.classic-tag').forEach((tag, idx) => {
	tag.addEventListener('click', function() {
	  const catKey = categories[idx];
	  const firstIndex = classicData.findIndex(item => item.category === catKey);
	  if (firstIndex !== -1) {
		classicCurrentIndex = firstIndex;
		renderClassicEntry(classicCurrentIndex);
	  }
	});
  });
}

function showClassicDialog() {
  clearTimeout(classicTimer);
  isClassicMode = true;
  birdMain.classList.add('daze');
  birdMain.classList.remove('idle', 'sing', 'sleep');
  [wingLeft, wingRight].forEach(w => w.classList.remove('flap','fastflap','open'));
  clearTimeout(sleepTimer);
  clearTimeout(idleTalkTimer);
  clearTimeout(idleStateTimer);
  clearTimeout(clickFailTimer);
  classicCurrentIndex = Math.floor(Math.random() * classicData.length);
  renderClassicEntry(classicCurrentIndex);
}

function closeClassicDialog() {
  clearTimeout(classicTimer);
  isClassicMode = false;
  dialog.classList.remove('show');
  dialog.className = 'dialog-box';
  dialog.innerHTML = '快来摸摸呱唧呱唧嘛';
  birdMain.classList.remove('daze');
  birdMain.classList.add('idle');
  setExpression('happy');
  resetIdleTimer();
}

let offsetX, offsetY;
petBox.addEventListener('mousedown', e => {
  dragActive = true;
  petBox.classList.add('dragging');
  offsetX = e.clientX - petBox.offsetLeft;
  offsetY = e.clientY - petBox.offsetTop;
  clearTimeout(clickFailTimer);
  resetIdleTimer();
});
document.addEventListener('mousemove', e => {
  if(!dragActive) return;
  const x = e.clientX - offsetX;
  const y = e.clientY - offsetY;
  petBox.style.left = x + 'px';
  petBox.style.top = y + 'px';
});
document.addEventListener('mouseup', () => {
  dragActive = false;
  petBox.classList.remove('dragging');
});

}
